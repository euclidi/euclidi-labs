name: Player bug report audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-report-audit
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/check_bug_reports.py
      - run: node --check assets/shared/bug-report.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/bug-report.mjs
